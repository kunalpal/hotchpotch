<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Itinerary</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        font-size: 14px;
        padding: 16px;
        color: #111;
        background: #fff;
      }
      #empty {
        color: #888;
        padding: 32px 0;
        text-align: center;
      }
      .day {
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        margin-bottom: 12px;
        overflow: hidden;
      }
      .day-header {
        background: #f5f5f5;
        padding: 8px 12px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
      }
      .day-header .location {
        font-weight: 400;
        color: #555;
      }
      .activity-list {
        list-style: none;
        padding: 8px 12px;
      }
      .activity-list li {
        padding: 4px 0;
        border-bottom: 1px solid #f0f0f0;
        color: #333;
      }
      .activity-list li:last-child {
        border-bottom: none;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="empty">Waiting for itinerary…</div></div>

    <script>
      const PROTOCOL = 'HOTCHPOTCH_WIDGET_V1';

      function send(type, payload) {
        window.parent.postMessage(
          {
            protocol: PROTOCOL,
            message_id: crypto.randomUUID(),
            reply_to: null,
            type,
            timestamp: Date.now(),
            payload,
          },
          '*'
        );
      }

      function render(data) {
        const root = document.getElementById('root');
        if (!data || !Array.isArray(data.days) || data.days.length === 0) {
          root.innerHTML = '<div id="empty">No itinerary data.</div>';
          return;
        }
        root.innerHTML = data.days
          .map(
            (day, i) => `
          <div class="day" data-day="${i}">
            <div class="day-header">
              <span>Day ${i + 1} &mdash; ${escHtml(day.date)}</span>
              <span class="location">${escHtml(day.location)}</span>
            </div>
            <ul class="activity-list">
              ${day.activities.map((a) => `<li>${escHtml(a)}</li>`).join('')}
            </ul>
          </div>`
          )
          .join('');
      }

      function escHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      window.addEventListener('message', (event) => {
        const msg = event.data;
        if (!msg || msg.protocol !== PROTOCOL) return;
        if (msg.type === 'MOUNT' || msg.type === 'REPLACE') {
          render(msg.payload.payload ?? msg.payload.initial_payload);
        }
      });

      // Handshake
      send('READY', {});
      send('REGISTER_TOOLS', { tools: [] });
      send('REGISTER_SKILLS', { skills: [] });
    </script>
  </body>
</html>
